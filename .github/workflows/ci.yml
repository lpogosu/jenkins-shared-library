name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A change request that is superseded before it finished building has nothing left to say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit: a tag is a mutable pointer, and a workflow that runs
      # whatever is behind v4 today is a workflow somebody else can change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # `check` is the test suite plus CodeNarc over the library and over the tests.
      - run: ./gradlew --no-daemon check

      # The regression callstacks are checked in. If a change moved one, the diff belongs in
      # the pull request rather than in a run that quietly rewrote it.
      - name: Fail if the recorded callstacks were not updated with the change
        run: git diff --exit-code -- test/resources/callstacks

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/codenarc
          retention-days: 7
